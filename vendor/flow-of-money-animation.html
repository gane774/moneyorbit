<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Flow of Money</title>
    <style>
        :root {
            --bg: #0B0C0F;
            --surface: #111318;
            --surface2: #171A21;
            --text: #F4F5F8;
            --text-sec: #A7ABB5;
            --border: #282D36;
            --primary: #7C6CFF;
            --cyan: #58C7F3;
            --green: #49D17D;
            --amber: #F4B860;
            --red: #F26D7D;
        }
        
        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        /* The scroll spacer creates the scrollable area */
        #scroll-spacer {
            height: 1800vh; /* Long scroll for smooth experience */
            width: 100%;
        }

        /* Fixed container for the SVG */
        #animation-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .instruction {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0.7;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .mouse {
            width: 24px;
            height: 36px;
            border: 2px solid var(--text-sec);
            border-radius: 12px;
            position: relative;
            margin-bottom: 8px;
        }

        .wheel {
            width: 4px;
            height: 8px;
            background: var(--primary);
            border-radius: 2px;
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            animation: scroll 1.5s infinite;
        }

        @keyframes scroll {
            0% { top: 6px; opacity: 1; }
            100% { top: 18px; opacity: 0; }
        }

        .btn-interactive {
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
        }
        
        .btn-interactive:hover rect {
            fill: #6A5AE0;
        }
    </style>
    <!-- GSAP for timeline and animations -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>
<body>

    <div id="scroll-spacer"></div>

    <div class="instruction" id="scroll-indicator">
        <div class="mouse"><div class="wheel"></div></div>
        <span style="font-size: 12px; letter-spacing: 2px; color: var(--text-sec); text-transform: uppercase;">Scroll to explore</span>
    </div>

    <div id="animation-container">
        <!-- Main viewBox is 1920x1080, standard 16:9 -->
        <svg id="main-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
            <defs>
                <!-- Grid Pattern -->
                <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
                    <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#171A21" stroke-width="1"/>
                    <circle cx="0" cy="0" r="1.5" fill="#282D36" />
                </pattern>

                <!-- Glow Filters -->
                <filter id="glow-primary" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="12" result="blur1" />
                    <feGaussianBlur stdDeviation="24" result="blur2" />
                    <feMerge>
                        <feMergeNode in="blur2" />
                        <feMergeNode in="blur1" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
                <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="10" result="blur" />
                    <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                </filter>
                <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="10" result="blur" />
                    <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                </filter>
                <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="15" result="blur" />
                    <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                </filter>

                <!-- Gradients -->
                <linearGradient id="grad-budget" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop offset="0%" stop-color="#7C6CFF" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#7C6CFF" stop-opacity="0.1"/>
                </linearGradient>
            </defs>

            <!-- Background -->
            <rect width="100%" height="100%" fill="#0B0C0F" />
            
            <!-- Camera Group (Moves inverse to particle to keep it centered) -->
            <g id="camera">
                <!-- Massive Grid Background -->
                <rect id="bg-grid" x="-2000" y="-1000" width="6000" height="5000" fill="url(#grid)" />

                <!-- The Main Circuit Path -->
                <path id="base-path" d="
                    M 960 300 
                    L 1420 300 Q 1520 300, 1520 400 
                    L 1520 700 Q 1520 800, 1420 800 
                    L 500 800 Q 400 800, 400 900 
                    L 400 1200 Q 400 1300, 500 1300 
                    L 1420 1300 Q 1520 1300, 1520 1400 
                    L 1520 1700 Q 1520 1800, 1420 1800 
                    L 500 1800 Q 400 1800, 400 1900 
                    L 400 2100
                " stroke="#282D36" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                
                <!-- Active Path Overlay (Revealed over time) -->
                <path id="active-path" d="
                    M 960 300 
                    L 1420 300 Q 1520 300, 1520 400 
                    L 1520 700 Q 1520 800, 1420 800 
                    L 500 800 Q 400 800, 400 900 
                    L 400 1200 Q 400 1300, 500 1300 
                    L 1420 1300 Q 1520 1300, 1520 1400 
                    L 1520 1700 Q 1520 1800, 1420 1800 
                    L 500 1800 Q 400 1800, 400 1900 
                    L 400 2100
                " stroke="#7C6CFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

                <!-- ================= SCENES CONTENT ================= -->

                <!-- Scene 1: START -->
                <g id="scene-start">
                    <text id="start-t1" x="960" y="150" text-anchor="middle" fill="#F4F5F8" font-size="72" font-weight="800" letter-spacing="-2">MONEY IS EVERYWHERE.</text>
                    <text id="start-t2" x="960" y="220" text-anchor="middle" fill="#A7ABB5" font-size="36" opacity="0">But where does it actually go?</text>
                </g>

                <!-- Scene 2: EARNING -->
                <g id="scene-earn" opacity="0.3">
                    <text x="1420" y="200" text-anchor="middle" fill="#F4F5F8" font-size="28" font-weight="bold">EARNING</text>
                    <text x="1420" y="230" text-anchor="middle" fill="#A7ABB5" font-size="16">The sources of flow</text>
                    
                    <!-- Inflow branches -->
                    <path d="M 1250 150 Q 1420 150, 1420 300" stroke="#49D17D" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
                    <path d="M 1590 150 Q 1420 150, 1420 300" stroke="#49D17D" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
                    <path d="M 1250 450 Q 1420 450, 1420 300" stroke="#49D17D" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
                    <path d="M 1590 450 Q 1420 450, 1420 300" stroke="#49D17D" stroke-width="2" fill="none" stroke-dasharray="4,4"/>
                    
                    <text x="1240" y="145" text-anchor="end" fill="#A7ABB5" font-size="14">Work</text>
                    <text x="1600" y="145" text-anchor="start" fill="#A7ABB5" font-size="14">Skills</text>
                    <text x="1240" y="460" text-anchor="end" fill="#A7ABB5" font-size="14">Business</text>
                    <text x="1600" y="460" text-anchor="start" fill="#A7ABB5" font-size="14">Assets</text>

                    <!-- Particles for inflow -->
                    <circle id="earn-p1" cx="1250" cy="150" r="4" fill="#49D17D" opacity="0"/>
                    <circle id="earn-p2" cx="1590" cy="150" r="4" fill="#49D17D" opacity="0"/>
                    <circle id="earn-p3" cx="1250" cy="450" r="4" fill="#49D17D" opacity="0"/>
                    <circle id="earn-p4" cx="1590" cy="450" r="4" fill="#49D17D" opacity="0"/>
                </g>

                <!-- Scene 3: MINDSET -->
                <g id="scene-mindset" opacity="0.3">
                    <text x="1520" y="520" text-anchor="middle" fill="#F4F5F8" font-size="28" font-weight="bold">THE FIRST CHOICE</text>
                    
                    <!-- Split paths -->
                    <path id="path-now" d="M 1520 600 L 1750 600" stroke="#F26D7D" stroke-width="4" fill="none" stroke-dasharray="6,6"/>
                    <circle cx="1750" cy="600" r="12" fill="#111318" stroke="#F26D7D" stroke-width="3"/>
                    <text x="1750" y="570" text-anchor="middle" fill="#F26D7D" font-size="20" font-weight="bold">NOW</text>
                    <text x="1750" y="635" text-anchor="middle" fill="#A7ABB5" font-size="14">Immediate Spend</text>
                    
                    <text x="1450" y="680" text-anchor="end" fill="#49D17D" font-size="20" font-weight="bold">LATER</text>
                    <text x="1450" y="705" text-anchor="end" fill="#A7ABB5" font-size="14">Accumulate</text>

                    <circle id="mindset-ghost" cx="1520" cy="600" r="15" fill="#F26D7D" opacity="0" filter="url(#glow-red)"/>
                </g>

                <!-- Scene 4: BUDGETING -->
                <g id="scene-budget" opacity="0.3">
                    <text x="1000" y="700" text-anchor="middle" fill="#F4F5F8" font-size="28" font-weight="bold">BUDGETING</text>
                    <text x="1000" y="730" text-anchor="middle" fill="#A7ABB5" font-size="16">Directing the flow</text>

                    <!-- Buckets -->
                    <g transform="translate(850, 850)">
                        <rect x="0" y="0" width="80" height="120" rx="4" fill="none" stroke="#282D36" stroke-width="2"/>
                        <rect id="fill-needs" x="2" y="118" width="76" height="0" rx="2" fill="url(#grad-budget)"/>
                        <text x="40" y="-15" text-anchor="middle" fill="#A7ABB5" font-size="14">NEEDS</text>
                        <text id="txt-needs" x="40" y="145" text-anchor="middle" fill="#F4F5F8" font-size="16" font-weight="bold">0%</text>
                    </g>
                    <g transform="translate(960, 850)">
                        <rect x="0" y="0" width="80" height="120" rx="4" fill="none" stroke="#282D36" stroke-width="2"/>
                        <rect id="fill-wants" x="2" y="118" width="76" height="0" rx="2" fill="url(#grad-budget)"/>
                        <text x="40" y="-15" text-anchor="middle" fill="#A7ABB5" font-size="14">WANTS</text>
                        <text id="txt-wants" x="40" y="145" text-anchor="middle" fill="#F4F5F8" font-size="16" font-weight="bold">0%</text>
                    </g>
                    <g transform="translate(1070, 850)">
                        <rect x="0" y="0" width="80" height="120" rx="4" fill="none" stroke="#282D36" stroke-width="2"/>
                        <rect id="fill-save" x="2" y="118" width="76" height="0" rx="2" fill="url(#grad-budget)"/>
                        <text x="40" y="-15" text-anchor="middle" fill="#A7ABB5" font-size="14">SAVINGS</text>
                        <text id="txt-save" x="40" y="145" text-anchor="middle" fill="#F4F5F8" font-size="16" font-weight="bold">0%</text>
                    </g>

                    <!-- Mini particles -->
                    <circle id="bp1" cx="1000" cy="800" r="6" fill="#7C6CFF" opacity="0"/>
                    <circle id="bp2" cx="1000" cy="800" r="6" fill="#7C6CFF" opacity="0"/>
                    <circle id="bp3" cx="1000" cy="800" r="6" fill="#7C6CFF" opacity="0"/>
                </g>

                <!-- Scene 5: BANKING -->
                <g id="scene-bank" opacity="0.3">
                    <text x="500" y="680" text-anchor="middle" fill="#F4F5F8" font-size="28" font-weight="bold">THE NETWORK</text>
                    
                    <!-- Abstract Network -->
                    <path d="M 500 800 L 400 700 L 300 750 L 500 800 L 600 720 L 700 800 L 500 800" stroke="#171A21" stroke-width="2" fill="none"/>
                    
                    <!-- Nodes -->
                    <circle cx="400" cy="700" r="20" fill="#111318" stroke="#58C7F3" stroke-width="2"/>
                    <text x="400" y="660" text-anchor="middle" fill="#58C7F3" font-size="14">BANK</text>
                    
                    <circle cx="600" cy="720" r="20" fill="#111318" stroke="#58C7F3" stroke-width="2"/>
                    <text x="600" y="680" text-anchor="middle" fill="#58C7F3" font-size="14">PAYMENT</text>
                    
                    <circle cx="300" cy="750" r="15" fill="#111318" stroke="#A7ABB5" stroke-width="2"/>
                    <text x="250" y="755" text-anchor="end" fill="#A7ABB5" font-size="12">MERCHANT</text>

                    <!-- Fast moving particle for UPI effect -->
                    <circle id="upi-particle" cx="500" cy="800" r="8" fill="#58C7F3" opacity="0" filter="url(#glow-cyan)"/>
                </g>

                <!-- Scene 6: SAVING -->
                <g id="scene-save" opacity="0.3">
                    <!-- The Reserve Shield -->
                    <circle id="reserve-shield" cx="400" cy="1100" r="80" fill="#111318" stroke="#58C7F3" stroke-width="4" filter="url(#glow-cyan)" opacity="0.5"/>
                    <text x="400" y="1090" text-anchor="middle" fill="#F4F5F8" font-size="20" font-weight="bold">EMERGENCY</text>
                    <text x="400" y="1115" text-anchor="middle" fill="#F4F5F8" font-size="20" font-weight="bold">FUND</text>

                    <!-- Expense Spike -->
                    <g id="expense-group" transform="translate(100, 1100)">
                        <path d="M 0 0 L 60 -15 L 120 0 L 60 15 Z" fill="#F26D7D" filter="url(#glow-red)"/>
                        <text x="60" y="-30" text-anchor="middle" fill="#F26D7D" font-size="16" font-weight="bold">₹12,000 EXPENSE</text>
                    </g>
                </g>

                <!-- Scene 7: CREDIT -->
                <g id="scene-credit" opacity="0.3">
                    <text x="1000" y="1180" text-anchor="middle" fill="#F4F5F8" font-size="28" font-weight="bold">CREDIT</text>
                    
                    <!-- Borrow In -->
                    <path d="M 800 1200 Q 900 1200, 950 1300" stroke="#F4B860" stroke-width="6" fill="none" stroke-dasharray="8,8"/>
                    <text x="800" y="1180" text-anchor="middle" fill="#F4B860" font-size="18">BORROW</text>
                    <circle id="credit-in-p" cx="800" cy="1200" r="8" fill="#F4B860" opacity="0"/>

                    <!-- Repay Out -->
                    <path d="M 1050 1300 Q 1150 1300, 1200 1400" stroke="#F26D7D" stroke-width="10" fill="none" stroke-dasharray="8,8"/>
                    <text x="1200" y="1430" text-anchor="middle" fill="#F26D7D" font-size="18">REPAY + INTEREST</text>
                    
                    <text id="credit-msg" x="1000" y="1400" text-anchor="middle" fill="#A7ABB5" font-size="20" opacity="0">Money now = Obligation later.</text>
                </g>

                <!-- Scene 8: MATH -->
                <g id="scene-math" opacity="0.3">
                    <text x="1420" y="1150" text-anchor="middle" fill="#F4F5F8" font-size="28" font-weight="bold">MONEY MATH</text>
                    <text x="1420" y="1180" text-anchor="middle" fill="#A7ABB5" font-size="16">Time & Compounding</text>

                    <!-- Axes -->
                    <line x1="1250" y1="1400" x2="1600" y2="1400" stroke="#282D36" stroke-width="2"/>
                    <line x1="1250" y1="1400" x2="1250" y2="1150" stroke="#282D36" stroke-width="2"/>
                    <text x="1620" y="1405" fill="#A7ABB5" font-size="14">TIME</text>

                    <!-- Exponential Curve -->
                    <path id="exp-curve" d="M 1250 1400 Q 1500 1400, 1550 1150" stroke="#F4B860" stroke-width="4" fill="none" stroke-dasharray="500" stroke-dashoffset="500" filter="url(#glow-primary)"/>

                    <!-- Clones (Hidden initially) -->
                    <g id="math-clones">
                        <!-- We will generate these dynamically or just place a few -->
                        <circle cx="1300" cy="1380" r="10" fill="#7C6CFF" opacity="0" class="mc"/>
                        <circle cx="1350" cy="1350" r="12" fill="#7C6CFF" opacity="0" class="mc"/>
                        <circle cx="1400" cy="1300" r="15" fill="#7C6CFF" opacity="0" class="mc"/>
                        <circle cx="1450" cy="1220" r="18" fill="#7C6CFF" opacity="0" class="mc"/>
                        <circle cx="1500" cy="1100" r="22" fill="#7C6CFF" opacity="0" class="mc"/>
                    </g>
                </g>

                <!-- Scene 9: INVESTING -->
                <g id="scene-invest" opacity="0.3">
                    <text x="1520" y="1480" text-anchor="middle" fill="#F4F5F8" font-size="28" font-weight="bold">INVESTING</text>
                    
                    <!-- Branches -->
                    <!-- Equity (Volatile) -->
                    <path d="M 1520 1500 Q 1600 1550, 1520 1600 T 1520 1700 L 1420 1800" stroke="#F26D7D" stroke-width="3" fill="none"/>
                    <text x="1620" y="1600" fill="#F26D7D" font-size="14">EQUITY (High Risk)</text>
                    
                    <!-- Fixed (Straight) -->
                    <path d="M 1520 1500 L 1450 1650 L 1420 1800" stroke="#58C7F3" stroke-width="3" fill="none"/>
                    <text x="1350" y="1650" fill="#58C7F3" font-size="14">FIXED (Steady)</text>
                    
                    <!-- Gold (Gentle) -->
                    <path d="M 1520 1500 Q 1550 1650, 1420 1800" stroke="#F4B860" stroke-width="3" fill="none"/>
                    <text x="1500" y="1680" fill="#F4B860" font-size="14">GOLD (Stable)</text>

                    <!-- Portfolio Recombine -->
                    <circle cx="1420" cy="1800" r="30" fill="none" stroke="#49D17D" stroke-width="4" stroke-dasharray="8,4"/>
                    <text x="1420" y="1750" text-anchor="middle" fill="#49D17D" font-size="16" font-weight="bold">PORTFOLIO</text>

                    <!-- Ghost particles for branches -->
                    <circle id="inv-p1" cx="1520" cy="1500" r="8" fill="#F26D7D" opacity="0"/>
                    <circle id="inv-p2" cx="1520" cy="1500" r="8" fill="#58C7F3" opacity="0"/>
                    <circle id="inv-p3" cx="1520" cy="1500" r="8" fill="#F4B860" opacity="0"/>
                </g>

                <!-- Scene 10: DESTINATIONS -->
                <g id="scene-dest" opacity="0.3">
                    <text x="1000" y="1650" text-anchor="middle" fill="#F4F5F8" font-size="28" font-weight="bold">DESTINATIONS</text>
                    
                    <!-- Orbit Rings -->
                    <circle cx="1000" cy="1800" r="100" fill="none" stroke="#282D36" stroke-width="1"/>
                    <circle cx="1000" cy="1800" r="150" fill="none" stroke="#282D36" stroke-width="1"/>

                    <!-- Nodes -->
                    <g id="dest-nodes">
                        <g transform="translate(1000, 1700)"><circle r="15" fill="#111318" stroke="#58C7F3" stroke-width="2"/><text y="30" text-anchor="middle" fill="#58C7F3" font-size="12">STOCKS</text></g>
                        <g transform="translate(1100, 1800)"><circle r="15" fill="#111318" stroke="#F4B860" stroke-width="2"/><text y="30" text-anchor="middle" fill="#F4B860" font-size="12">GOLD</text></g>
                        <g transform="translate(1000, 1900)"><circle r="15" fill="#111318" stroke="#49D17D" stroke-width="2"/><text y="30" text-anchor="middle" fill="#49D17D" font-size="12">MUTUAL FUNDS</text></g>
                        <g transform="translate(850, 1800)"><circle r="15" fill="#111318" stroke="#7C6CFF" stroke-width="2"/><text y="30" text-anchor="middle" fill="#7C6CFF" font-size="12">FD / RD</text></g>
                    </g>
                </g>

                <!-- Scene 11: SCAMS -->
                <g id="scene-scam" opacity="0.3">
                    <text x="500" y="1700" text-anchor="middle" fill="#F4F5F8" font-size="28" font-weight="bold">PROTECT YOUR FLOW</text>
                    
                    <!-- Scam Branch -->
                    <path d="M 600 1800 L 580 1850 L 620 1890 L 570 1940 L 600 1980" stroke="#F26D7D" stroke-width="6" fill="none" filter="url(#glow-red)"/>
                    <text x="630" y="1850" fill="#F26D7D" font-size="18" font-weight="bold">"30% GUARANTEED"</text>
                    
                    <!-- Warning Signs -->
                    <g id="scam-warnings" opacity="0">
                        <rect x="650" y="1880" width="120" height="30" rx="4" fill="#F26D7D"/>
                        <text x="710" y="1900" text-anchor="middle" fill="#111318" font-size="14" font-weight="bold">URGENCY!</text>
                        
                        <rect x="620" y="1930" width="140" height="30" rx="4" fill="#F26D7D"/>
                        <text x="690" y="1950" text-anchor="middle" fill="#111318" font-size="14" font-weight="bold">UNKNOWN SOURCE</text>
                    </g>
                </g>

                <!-- FINAL SCENE MARKER -->
                <g id="scene-final">
                    <circle cx="400" cy="2100" r="40" fill="#111318" stroke="#7C6CFF" stroke-width="4"/>
                    <circle cx="400" cy="2100" r="20" fill="#7C6CFF" filter="url(#glow-primary)"/>
                </g>

                <!-- THE PROTAGONIST PARTICLE -->
                <g id="protagonist" transform="translate(960, 300)">
                    <circle id="p-core" r="24" fill="#111318" stroke="#7C6CFF" stroke-width="6" filter="url(#glow-primary)"/>
                    <text text-anchor="middle" dominant-baseline="central" fill="#F4F5F8" font-size="28" font-weight="bold" y="2">₹</text>
                </g>
            </g> <!-- End Camera -->

            <!-- Fixed UI Layer (Appears at the end) -->
            <g id="final-ui" opacity="0" pointer-events="none">
                <rect width="1920" height="1080" fill="#0B0C0F" opacity="0.6"/>
                <text x="960" y="450" text-anchor="middle" fill="#F4F5F8" font-size="72" font-weight="800" letter-spacing="-1">NOW YOU SEE HOW MONEY MOVES.</text>
                <text x="960" y="520" text-anchor="middle" fill="#A7ABB5" font-size="24">Everything is connected. Your choices shape the flow.</text>
                
                <!-- CTA Button -->
                <g transform="translate(810, 600)" class="btn-interactive" onclick="alert('Ready to start learning!')">
                    <rect width="300" height="80" rx="40" fill="#7C6CFF" />
                    <text x="150" y="48" text-anchor="middle" fill="#111318" font-size="24" font-weight="bold">START LEARNING</text>
                </g>
            </g>

        </svg>
    </div>

    <script>
        // Ensure scripts run after DOM is ready
        document.addEventListener("DOMContentLoaded", () => {
            
            // GSAP Timeline setup
            const tl = gsap.timeline({ paused: true });
            
            // Helpers for camera positioning
            const W = 1920, H = 1080;
            const cx = (x) => W/2 - x;
            const cy = (y) => H/2 - y;
            
            const p = "#protagonist";
            const c = "#camera";
            const pCore = "#p-core";

            // Initialize positions
            gsap.set(p, { x: 960, y: 300, scale: 0 });
            gsap.set(c, { x: cx(960), y: cy(300), scale: 1 });
            gsap.set("#active-path", { strokeDasharray: 6000, strokeDashoffset: 6000 });

            // ==========================================
            // BUILD THE MASTER TIMELINE
            // We use arbitrary durations (e.g., 1, 2, 3) 
            // because the whole timeline will be scrubbed 0 to 1.
            // ==========================================

            // 1. START
            tl.to(p, { scale: 1, duration: 1, ease: "back.out(1.5)" }, 0)
              .to("#start-t1", { opacity: 0, y: -50, duration: 1 }, 0.5)
              .to("#start-t2", { opacity: 1, y: -20, duration: 1 }, 0.5)
              .to("#start-t2", { opacity: 0, duration: 1 }, 2)

            // ==========================================
            // SCROLL MAPPING LOGIC
            // ==========================================
            let targetProgress = 0;
            let currentProgress = 0;
            let isScrolling = false;

            function updateScroll() {
                const maxScroll = document.body.scrollHeight - window.innerHeight;
                if (maxScroll > 0) {
                    targetProgress = window.scrollY / maxScroll;
                    targetProgress = Math.max(0, Math.min(1, targetProgress));
                }
                
                // Hide scroll indicator once user starts scrolling
                if (window.scrollY > 100 && document.getElementById('scroll-indicator').style.opacity !== '0') {
                    document.getElementById('scroll-indicator').style.opacity = '0';
                }
            }

            window.addEventListener('scroll', updateScroll, { passive: true });
            window.addEventListener('resize', updateScroll);

            // Render loop for smooth interpolation
            function render() {
                // Lerp formula for smooth catching up
                const diff = targetProgress - currentProgress;
                if (Math.abs(diff) > 0.0001) {
                    currentProgress += diff * 0.08; // Adjust 0.08 for more/less smoothing
                    tl.progress(currentProgress);
                }
                requestAnimationFrame(render);
            }
            
            // Start loop
            render();

            // Setup API as requested by prompt
            window.startAnimation = function() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            window.stopAnimation = function() {
                // Not applicable in pure scroll-driven, but defined to prevent errors
            };
            window.resetAnimation = function() {
                window.scrollTo({ top: 0, behavior: 'instant' });
                targetProgress = 0;
                currentProgress = 0;
                tl.progress(0);
            };
        });
